# dsh-guard bundle patch: mounts the runtime guard into a dsh profile's host
# composition. It registers no tools and no system-prompt section — it only
# listens to session events, arms one synchronous tool guard, and serves four
# read-mostly HTTP routes under /plugins/dsh-guard/.
#
# Install:  dsh plugin --profile <name> add <path-to-this-package>
# Rollback: dsh plugin --profile <name> remove dsh-guard   (or set mode: observe)
- insert:
    - id: dsh-guard
      # Node-resolvable package name — must stay in sync with package.json `name`.
      name: 'dsh-guard'
      config:
        # observe = 只记录（绝不干预） · advise = + 注入提醒
        # enforce = + 硬闸：三道防卡死闸（宿主级并发 / 单会话 / 滞后泄压）
        #           + 提醒被无视后拒绝该步（spinning/repeating/over-budget）
        mode: enforce
        # Relative paths resolve under $DSH_HOME and get a per-workspace
        # subdirectory, so the guard never writes inside your repository.
        stateRoot: 'guard'
        # Every threshold below has a measured justification; see README.
        # idle:      { windowMs: 600000, minTokens: 20000, minToolCalls: 8, graceMs: 180000 }
        # repeats:   { warn: 5, critical: 10 }
        # heavy:     { maxConcurrent: 1, maxPer10Min: 3, timeoutMs: 600000 }
        # refusals:  { limit: 3 }
        # budget:    { perSessionTokens: 0, perSessionYuan: 0, onExceed: notify }
        # heartbeat: { suspectMs: 600000, parkMs: 1800000 }
        # 自愈：report=只报告；repair=额外把「死进程遗留的 working 成员」置回 idle
        # （只改成员状态并留 statusBefore，不碰任务归属）
        selfheal:
          agentTeams: repair
        # 自恢复（把看门狗做进插件本体；不需要 sudo、不需要 systemd 单元）
        # recovery:
        #   enabled: true
        #   selfExit: true            # 事件循环滞后超阈值 ⇒ 主动退出，systemd 3 秒重拉宿主
        #   lagThresholdMs: 30000     # 单次滞后达此值即视为卡死（实测最坏 45s）
        #   confirmations: 1          # 连续 N 次观测才动手（防抖）
        #   cooldownMs: 600000        # 冷却
        #   maxPerHour: 3             # 每小时上限
        #   helper: true              # 插件自己 spawn 守卫子进程（对付"循环再也不回来"）
        #   wrapperPattern: 'dsh-web-wrapper.mjs'   # 唯一允许击杀的目标特征（绝不信任 ppid）
